[package]
name        = "shared_kerning"
version     = "1.1.0"
edition     = "2024"
license     = "Proprietary"
description = "Shared 11 KB Hardware Bitboard POPCNT CSR Optical Kerning, NFD Diacritic Overhang & CJK Mojikumi Engine"

[lib]
name = "shared_kerning"
path = "src/lib.rs"

[dependencies]
egui = { version = "0.29", default-features = false }

[dev-dependencies]
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
